<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Observer</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        /* 1. CSS Variables for single-source-of-truth styling */
        :root {
            --bg-color: #235280;
            --plot-color: #182e63;
            --marker-color: #578b54;
            --temp-color: #ff9f0a;
            --humid-color: #64ffda;
            --wind-color: #30d158;
            --grid-color: #182e63;
            --text-color: #ffffff;
            --header-color: #FFFFFF;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            font-family: sans-serif;
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
        }
        #dashboard {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            height: 85vh;
            padding: 20px;
            gap: 20px;
            min-height: 0;
        }
        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }
        h1 {
            text-align: center;
            font-weight: 200;
            margin-top: 10px;
            margin-bottom: 5px;
            color: var(--header-color);
        }
        .chart-box {
            background: var(--plot-color);
            border-radius: 8px;
            padding: 5px;
            min-height: 0;
        }
        .chart-container .chart-box {
            flex: 1;
        }
    </style>
</head>

<body>
<h1>Avista WeatherNet Analysis</h1>
<h2 id="station-name" style="text-align: center; font-weight: 300; color: #44b2f9;">Loading...</h2>
<div id="dashboard">
    <div id="map-plot" class="chart-box"></div>
    <div class="chart-container">
        <div id="temp-plot" class="chart-box"></div>
        <div id="humid-plot" class="chart-box"></div>
        <div id="wind-plot" class="chart-box"></div>
    </div>
</div>

<script>
// 2. Cache DOM Elements
const stationNameEl = document.getElementById('station-name');

// Extract colors from CSS to use in Plotly
const rootStyles = getComputedStyle(document.documentElement);
const COLORS = {
    bg: rootStyles.getPropertyValue('--bg-color').trim(),
    plot: rootStyles.getPropertyValue('--plot-color').trim(),
    marker: rootStyles.getPropertyValue('--marker-color').trim(),
    temp: rootStyles.getPropertyValue('--temp-color').trim(),
    humid: rootStyles.getPropertyValue('--humid-color').trim(),
    wind: rootStyles.getPropertyValue('--wind-color').trim(),
    grid: rootStyles.getPropertyValue('--grid-color').trim()
};

// 3. Modern Async/Await Initialization
async function initDashboard() {
    try {
        const response = await fetch('weather_data.json');
        if (!response.ok) throw new Error("Could not load weather_data.json. Check file name and path.");

        const data = await response.json();

        if (!data || data.length === 0) throw new Error("Weather data is empty.");

        // 4. Pre-process and Group Data (O(1) lookups)
        const dataBySite = data.reduce((acc, current) => {
            if (!acc[current.site_name]) {
                acc[current.site_name] = [];
            }
            acc[current.site_name].push(current);
            return acc;
        }, {});

        const sites = Object.keys(dataBySite);
        const initialSite = sites[0];

        // Grab the first entry of each site to get its coordinates for the map
        const uniqueLocs = sites.map(name => dataBySite[name][0]);

        // Render the Map
        const mapData = [{
            type: 'scattermap',
            lat: uniqueLocs.map(d => d.latitude),
            lon: uniqueLocs.map(d => d.longitude),
            mode: 'markers',
            marker: { size: 14, color: COLORS.marker },
            text: uniqueLocs.map(d => d.site_name),
            hoverinfo: 'text'
        }];

        const mapLayout = {
            map: {
                style: "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json",
                zoom: 8,
                center: { lat: uniqueLocs[0].latitude, lon: uniqueLocs[0].longitude }
            },
            margin: { l: 0, r: 0, t: 0, b: 0 },
            paper_bgcolor: COLORS.bg,
            plot_bgcolor: COLORS.plot
        };

        Plotly.newPlot('map-plot', mapData, mapLayout, { responsive: true });

        // Chart Update Function
        function updateCharts(siteName) {
            stationNameEl.innerText = siteName;

            // Instant lookup instead of filtering the whole array
            const siteData = dataBySite[siteName];
            const times = siteData.map(d => d.sample_time_str || d.sample_time);

            const commonLayout = (title) => ({
                paper_bgcolor: COLORS.plot,
                plot_bgcolor: COLORS.plot,
                margin: { t: 35, b: 30, l: 50, r: 20 },
                font: { color: 'white', size: 10 },
                title: { text: title, font: { size: 14, color: 'white' } },
                xaxis: { gridcolor: COLORS.grid, showspikes: true, color: 'white' },
                yaxis: { gridcolor: COLORS.grid, color: 'white' },
                showlegend: false
            });

            const trace = (yData, color) => [{
                x: times, y: yData,
                type: 'scatter', mode: 'lines', connectgaps: true,
                line: { color: color, width: 3, shape: 'linear' },
                fill: 'tozeroy', fillcolor: color + '22'
            }];

            Plotly.newPlot('temp-plot', trace(siteData.map(d => d.air_temperature), COLORS.temp), commonLayout('TEMPERATURE'), { responsive: true });
            Plotly.newPlot('humid-plot', trace(siteData.map(d => d.relative_humidity), COLORS.humid), commonLayout('HUMIDITY (%)'), { responsive: true });
            Plotly.newPlot('wind-plot', trace(siteData.map(d => d.wind_speed), COLORS.wind), commonLayout('WIND SPEED'), { responsive: true });
        }

        // Attach click listener
        document.getElementById('map-plot').on('plotly_click', function(clickData){
            const newSite = clickData.points[0].text;
            updateCharts(newSite);
        });

        // Initialize first view
        updateCharts(initialSite);

    } catch (err) {
        console.error(err);
        stationNameEl.innerText = "Error Loading Data";
        stationNameEl.style.color = "red";
        document.body.innerHTML += `<div style="color:red; text-align:center; padding: 20px;">${err.message}</div>`;
    }
}

// Start the application
initDashboard();
</script>
</body>
</html>
